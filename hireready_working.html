function toast(msg){
  var t=document.getElementById('T');
  if(!t){t=document.createElement('div');t.id='T';t.style='position:fixed;bottom:20px;right:20px;background:#2E7D32;color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:700;z-index:9999;font-family:system-ui,sans-serif';document.body.appendChild(t);}
  t.textContent=msg;t.style.display='block';
  clearTimeout(t.x);t.x=setTimeout(function(){t.style.display='none';},2500);
}

function setMode(m){M=m;CP=0;KP=0;draw();}
function setCP(i){CP=i;draw();}
function setKP(i){KP=i;draw();}

function draw(){
  var root=document.getElementById('R');
  if(!root)return;
  var isC=M==='c';
  var cur=isC?CP:KP;
  var cLabels=['Overview','Job tracker','Applications','Interview prep','CV vault','Email templates','Rejection analyser','Chat'];
  var kLabels=['Overview','Members','Upsells','Revenue','Settings'];
  var labels=isC?cLabels:kLabels;

  var html='';

  // Topbar
  html+='<div style="background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">';
  html+='<div style="font-size:18px;font-weight:800;color:#111">Hire<span style="color:#1565C0">Ready</span></div>';
  html+='<div style="display:flex;background:#f0f0f0;border-radius:8px;padding:3px;gap:2px">';
  html+='<button onclick="setMode(\'c\')" style="padding:6px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:'+(isC?'1px solid #90CAF9':'none')+';background:'+(isC?'#fff':'transparent')+';color:'+(isC?'#1565C0':'#888')+';font-family:inherit">Candidate view</button>';
  html+='<button onclick="setMode(\'k\')" style="padding:6px 16px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;border:'+(!isC?'1px solid #90CAF9':'none')+';background:'+(!isC?'#fff':'transparent')+';color:'+(!isC?'#1565C0':'#888')+';font-family:inherit">Coach view</button>';
  html+='</div>';
  html+='<div style="display:flex;align-items:center;gap:8px"><div style="width:30px;height:30px;border-radius:50%;background:'+(isC?'#BBDEFB':'#C8E6C9')+';color:'+(isC?'#1565C0':'#1B5E20')+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800">'+(isC?'SR':'YS')+'</div><span style="font-size:13px;font-weight:600">'+(isC?'Sara R.':'Yana Senina')+'</span></div>';
  html+='</div>';

  // Nav tabs
  html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #ddd">';
  labels.forEach(function(l,i){
    var on=i===cur;
    html+='<button onclick="'+(isC?'setCP':'setKP')+'('+i+')" style="padding:6px 14px;border-radius:8px;font-size:12px;font-weight:'+(on?'700':'400')+';cursor:pointer;border:'+(on?'1px solid #90CAF9':'1px solid transparent')+';background:'+(on?'#fff':'transparent')+';color:'+(on?'#1565C0':'#666')+';font-family:inherit">'+l+'</button>';
  });
  html+='</div>';

  // Page content
  if(isC){
    if(cur===0)html+=pageCandOv();
    else if(cur===1)html+=pageKanban();
    else if(cur===2)html+=pageApps();
    else if(cur===3)html+=pagePrep();
    else if(cur===4)html+=pageCVV();
    else if(cur===5)html+=pageEmails();
    else if(cur===6)html+=pageRej();
    else if(cur===7)html+=pageChat();
  } else {
    if(cur===0)html+=pageCoachOv();
    else if(cur===1)html+=pageMems();
    else if(cur===2)html+=pageUpsells();
    else if(cur===3)html+=pageRev();
    else if(cur===4)html+=pageSettings();
  }

  root.innerHTML=html;

  // Post-render
  if(isC&&cur===1)buildKb();
  if(isC&&cur===3)bindPT();

function card(inner){return '<div style="background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px 20px;margin-bottom:14px">'+inner+'</div>';}
function ct(t){return '<div style="font-size:15px;font-weight:700;margin-bottom:12px;color:#111">'+t+'</div>';}
function statsGrid(items){
  var h='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">';
  items.forEach(function(s){h+='<div style="background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px"><div style="font-size:11px;color:#888;margin-bottom:4px">'+s.l+'</div><div style="font-size:24px;font-weight:800;color:'+s.c+'">'+s.v+'</div></div>';});
  return h+'</div>';
}
function abox(head,body,bg,hc,btns){
  return '<div style="background:'+bg+';border:1px solid '+hc+'44;border-radius:10px;padding:12px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap"><div><div style="font-size:12px;font-weight:700;color:'+hc+'">'+head+'</div><div style="font-size:11px;color:'+hc+';opacity:.8;margin-top:3px;line-height:1.5">'+body+'</div></div><div style="display:flex;gap:6px;flex-shrink:0">'+(btns||'')+'</div></div>';
}
function pbtn(label,bg,fg,onclick){return '<button onclick="'+onclick+'" style="padding:5px 12px;background:'+bg+';color:'+fg+';border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit">'+label+'</button>';}
function stag(label,bg,fg){return '<span style="display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700;background:'+bg+';color:'+fg+'">'+label+'</span>';}

function pageKanban(){

  h+='<div><div style="font-size:18px;font-weight:700">Job tracker</div><div style="font-size:12px;color:#888;margin-top:2px">Drag cards between columns — coach sees this live</div></div>';

  h+='</div><div id="KB" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"></div>';
  return h;
}

function buildKb(){
  var b=document.getElementById('KB');if(!b)return;
  b.innerHTML='';
  KC.forEach(function(col){
    var cs=JOBS.filter(function(j){return j.col===col});
    var div=document.createElement('div');
    div.style='background:#f5f5f5;border:1px solid #ddd;border-radius:10px;padding:10px;min-height:130px';
    div.innerHTML='<div style="font-size:11px;font-weight:700;color:#888;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><span>'+col+'</span><span style="background:#fff;border:1px solid #ddd;border-radius:20px;padding:1px 7px;font-size:10px">'+cs.length+'</span></div>';
    div.addEventListener('dragover',function(e){e.preventDefault();div.style.border='2px dashed #1565C0';});
    div.addEventListener('dragleave',function(){div.style.border='1px solid #ddd';});
    div.addEventListener('drop',function(e){
      e.preventDefault();div.style.border='1px solid #ddd';
      if(DG===null)return;
      var j=JOBS.find(function(x){return x.id===DG});
      if(j)j.col=col;DG=null;buildKb();
    });
    cs.forEach(function(c){
      var bg=c.conf>=75?'#E8F5E9':c.conf>=60?'#E3F2FD':c.conf>0?'#FFF8E1':'#f0f0f0';
      var fg=c.conf>=75?'#1B5E20':c.conf>=60?'#0D47A1':c.conf>0?'#E65100':'#666';
      var kd=document.createElement('div');
      kd.draggable=true;
      kd.style='background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:7px;cursor:grab';
      kd.innerHTML='<div style="font-size:12px;font-weight:600;margin-bottom:2px">'+c.t+'</div><div style="font-size:11px;color:#888;margin-bottom:7px">'+c.co+'</div>'+stag(c.conf>0?c.conf+'% ready':'Not started',bg,fg);
      kd.addEventListener('dragstart',function(){DG=c.id;kd.style.opacity='0.4';});
      kd.addEventListener('dragend',function(){kd.style.opacity='1';});
      div.appendChild(kd);
    });
    var add=document.createElement('div');
    add.style='border:1px dashed #bbb;border-radius:8px;padding:6px;text-align:center;font-size:11px;color:#999;cursor:pointer;margin-top:4px';
    add.textContent='+ Add';
    add.onclick=function(){JOBS.push({id:Date.now(),t:'New role',co:'Company',col:col,conf:0,s:[1,0,0,0,0,0,0,0]});buildKb();};
    div.appendChild(add);
    b.appendChild(div);
  });
}

function pageApps(){

  h+='</div>';
  JOBS.forEach(function(j){
    var done=j.s.filter(Boolean).length;

      var isDone=j.s[i],isAct=i===done-1;

      var lineC=isDone?'#2E7D32':'#e0e0e0';
      var titleC=isDone?'#aaa':isAct?'#1565C0':'#333';
      var ctaH='';
      if(isDone&&!j.s[i+1]&&CTA[i+1]){
        var c=CTA[i+1];
        ctaH='<div style="background:'+c.c+';border:1px solid '+c.bc+'66;border-radius:8px;padding:8px 12px;margin:4px 0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">'
          +'<div><div style="font-size:12px;font-weight:700;color:#333">'+c.h+'</div><div style="font-size:11px;color:#555;margin-top:1px">'+c.b+'</div></div>'
          +'<button onclick="(function(){var j=JOBS.find(function(x){return x.id==='+j.id+'});if(j)j.s['+(i+1)+']=1;setCP(2);})()" style="padding:5px 12px;background:#1565C0;color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0">Do it</button></div>';
      }
      flow+='<div style="display:flex;align-items:stretch">'
        +'<div style="display:flex;flex-direction:column;align-items:center;width:30px;flex-shrink:0">'
        +'<div onclick="(function(){var j=JOBS.find(function(x){return x.id==='+j.id+'});if(j)j.s['+i+']=1;setCP(2);})()" style="width:24px;height:24px;border-radius:50%;background:'+dotBg+';border:2px solid '+dotBd+';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:'+dotFg+';cursor:pointer;z-index:1;flex-shrink:0">'+(isDone?'✓':(i+1))+'</div>'
        +(i<PS.length-1?'<div style="width:2px;flex:1;background:'+lineC+';margin:2px 0"></div>':'')+'</div>'
        +'<div style="flex:1;padding:0 0 10px 10px"><div style="font-size:12px;font-weight:600;padding-top:3px;color:'+titleC+'">'+s+'</div>'+ctaH+'</div></div>';
    });
    h+='<div style="background:#fff;border:1px solid #ddd;border-radius:10px;margin-bottom:10px;overflow:hidden">'
      +'<div onclick="var d=document.getElementById(\'apd'+j.id+'\');d.style.display=d.style.display===\'none\'?\'block\':\'none\'" style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;cursor:pointer">'
      +'<div><div style="font-size:14px;font-weight:700">'+j.t+' — '+j.co+'</div><div style="font-size:11px;color:#888;margin-top:2px">'+done+' of 8 stages</div></div>'
      +'<div style="display:flex;align-items:center;gap:10px">'+stag(PS[done-1],sbg,sfg)
      +'<button style="padding:4px 12px;background:#f0f0f0;border:none;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit">Details</button></div></div>'
      +'<div id="apd'+j.id+'" style="display:none;border-top:1px solid #f5f5f5;padding:16px">'+flow+'</div></div>';
  });
  return h;
}
